version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      commit-message:
          prefix: chore(deps)
      groups:
          npm-all:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch

    - package-ecosystem: cargo
      directory: /src-tauri
      schedule:
          interval: monthly
      commit-message:
          prefix: chore(deps)
      groups:
          cargo-all:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      commit-message:
          prefix: chore(deps)
      groups:
          actions-all:
              patterns:
                  - '*'
