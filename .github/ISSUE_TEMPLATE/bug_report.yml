name: Bug Report
description: Something isn't working
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              **Please attach your log file.** Open the app, go to Settings, click "Open Log File", then drag the file into the comment box below the form. Large logs as file attachments are much easier to read than pasted text.
    - type: textarea
      id: description
      attributes:
          label: What happened?
          placeholder: Describe what you did and what went wrong.
      validations:
          required: true
    - type: dropdown
      id: launcher
      attributes:
          label: Game launcher
          options:
              - Steam
              - Epic Games
              - Xbox / Game Pass
      validations:
          required: true
    - type: dropdown
      id: os
      attributes:
          label: Operating system
          options:
              - Windows
              - Linux
      validations:
          required: true
    - type: textarea
      id: log
      attributes:
          label: Relevant log lines (optional)
          description: If the error is short, paste just the relevant lines here. For the full log, attach the file in the comment box after submitting.
          placeholder: Paste a short snippet here, or leave blank and attach the full file below...
