name: Discord Release Notification
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Version tag'
                default: 'v0.9.2-test'
            release_body:
                description: 'Release notes'
                default: '- Test bullet point\n- Another fix'
            release_url:
                description: 'Release URL'
                default: 'https://github.com/modrexio/modrex'

jobs:
    notify:
        runs-on: ubuntu-latest
        steps:
            - name: Post to Discord
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
              run: |
                  TAG="${{ github.event.release.tag_name || inputs.tag_name }}"
                  BODY="${{ github.event.release.body || inputs.release_body }}"
                  URL="${{ github.event.release.html_url || inputs.release_url }}"
                  curl -H "Content-Type: application/json" \
                    -d "{
                      \"username\": \"Modrex\",
                      \"embeds\": [{
                        \"title\": \"$TAG\",
                        \"description\": \"$BODY\",
                        \"url\": \"$URL\",
                        \"color\": 5814783
                      }]
                    }" \
                    "$DISCORD_WEBHOOK"
