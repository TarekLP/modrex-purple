name: Discord Release Notification
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Version tag to fetch and post'
                default: 'v0.9.1'

jobs:
    notify:
        runs-on: ubuntu-latest
        steps:
            - name: Post to Discord
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  GH_TOKEN: ${{ github.token }}
                  EVENT_NAME: ${{ github.event_name }}
                  REPOSITORY: ${{ github.repository }}
                  INPUT_TAG: ${{ inputs.tag_name }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  RELEASE_BODY: ${{ github.event.release.body }}
                  RELEASE_URL: ${{ github.event.release.html_url }}
              run: |
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    RELEASE=$(gh api "repos/$REPOSITORY/releases/tags/$INPUT_TAG")
                    TAG=$(echo "$RELEASE" | jq -r '.tag_name')
                    BODY=$(echo "$RELEASE" | jq -r '.body')
                    URL=$(echo "$RELEASE" | jq -r '.html_url')
                  else
                    TAG="$RELEASE_TAG"
                    BODY="$RELEASE_BODY"
                    URL="$RELEASE_URL"
                  fi
                  PAYLOAD=$(jq -n \
                    --arg tag "$TAG" \
                    --arg body "$BODY" \
                    --arg url "$URL" \
                    '{username:"Modrex",avatar_url:"https://github.com/modrexio.png",embeds:[{title:$tag,description:$body,url:$url,color:5814783}]}')
                  curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
