name: Discord Release Notification
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Version tag to fetch and post'
                default: 'v0.9.1'

jobs:
    notify:
        runs-on: ubuntu-latest
        steps:
            - name: Post to Discord
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    RELEASE=$(gh api repos/${{ github.repository }}/releases/tags/${{ inputs.tag_name }})
                    TAG=$(echo "$RELEASE" | jq -r '.tag_name')
                    BODY=$(echo "$RELEASE" | jq -r '.body')
                    URL=$(echo "$RELEASE" | jq -r '.html_url')
                  else
                    TAG="${{ github.event.release.tag_name }}"
                    BODY="${{ github.event.release.body }}"
                    URL="${{ github.event.release.html_url }}"
                  fi
                  PAYLOAD=$(jq -n \
                    --arg tag "$TAG" \
                    --arg body "$BODY" \
                    --arg url "$URL" \
                    '{username:"Modrex",avatar_url:"https://github.com/modrexio.png",embeds:[{title:$tag,description:$body,url:$url,color:5814783}]}')
                  curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
