name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable
            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - run: pnpm install --frozen-lockfile
            - run: pnpm build
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

            - uses: actions/upload-artifact@v4
              with:
                  name: windows-nsis
                  path: |
                      src-tauri/target/release/bundle/nsis/*.exe
                      src-tauri/target/release/bundle/nsis/*.sig

    build-linux:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    rpm

            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable
            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

            - uses: actions/upload-artifact@v4
              with:
                  name: linux-deb
                  path: src-tauri/target/release/bundle/deb/*.deb

            - uses: actions/upload-artifact@v4
              with:
                  name: linux-rpm
                  path: src-tauri/target/release/bundle/rpm/*.rpm

            - uses: actions/upload-artifact@v4
              with:
                  name: linux-appimage
                  path: |
                      src-tauri/target/release/bundle/appimage/*.AppImage
                      src-tauri/target/release/bundle/appimage/*.sig

    publish:
        needs: [build-windows, build-linux]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4

            - name: Extract version
              id: ver
              run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - name: Generate latest.yml (electron-updater compat for Windows)
              run: |
                  EXE=$(ls windows-nsis/*.exe | head -1)
                  FILENAME=$(basename "$EXE")
                  SHA512=$(openssl dgst -sha512 -binary "$EXE" | base64 -w 0)
                  SIZE=$(stat -c%s "$EXE")
                  DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  cat > latest.yml <<EOF
                  version: ${{ steps.ver.outputs.version }}
                  files:
                    - url: $FILENAME
                      sha512: $SHA512
                      size: $SIZE
                  path: $FILENAME
                  sha512: $SHA512
                  releaseDate: '$DATE'
                  EOF

            - name: Rename Linux deb and generate latest-linux.yml (electron-updater compat)
              run: |
                  VERSION=${{ steps.ver.outputs.version }}
                  ORIG=$(ls linux-deb/*.deb | head -1)
                  DEBNAME="pd3-mod-manager_${VERSION}_amd64.deb"
                  mv "$ORIG" "linux-deb/$DEBNAME"
                  SHA512=$(openssl dgst -sha512 -binary "linux-deb/$DEBNAME" | base64 -w 0)
                  SIZE=$(stat -c%s "linux-deb/$DEBNAME")
                  DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  cat > latest-linux.yml <<EOF
                  version: $VERSION
                  files:
                    - url: $DEBNAME
                      sha512: $SHA512
                      size: $SIZE
                  path: $DEBNAME
                  sha512: $SHA512
                  releaseDate: '$DATE'
                  EOF

            - name: Generate latest.json (tauri-plugin-updater)
              run: |
                  TAG=$GITHUB_REF_NAME
                  DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  WIN_EXE=$(ls windows-nsis/*.exe | head -1)
                  WIN_FILENAME=$(basename "$WIN_EXE")
                  WIN_SIG=$(cat "windows-nsis/${WIN_FILENAME}.sig")
                  LINUX_APPIMAGE=$(ls linux-appimage/*.AppImage | head -1)
                  LINUX_FILENAME=$(basename "$LINUX_APPIMAGE")
                  LINUX_SIG=$(cat "linux-appimage/${LINUX_FILENAME}.sig")
                  jq -n \
                    --arg version "${{ steps.ver.outputs.version }}" \
                    --arg pub_date "$DATE" \
                    --arg win_sig "$WIN_SIG" \
                    --arg win_url "https://github.com/modrexio/modrex/releases/download/$TAG/$WIN_FILENAME" \
                    --arg linux_sig "$LINUX_SIG" \
                    --arg linux_url "https://github.com/modrexio/modrex/releases/download/$TAG/$LINUX_FILENAME" \
                    '{version: $version, notes: "", pub_date: $pub_date, platforms: {"windows-x86_64": {signature: $win_sig, url: $win_url}, "linux-x86_64": {signature: $linux_sig, url: $linux_url}}}' \
                    > latest.json

            - name: Publish release
              uses: softprops/action-gh-release@v2
              with:
                  name: Modrex ${{ github.ref_name }}
                  draft: false
                  generate_release_notes: true
                  files: |
                      windows-nsis/*.exe
                      linux-deb/*.deb
                      linux-rpm/*.rpm
                      linux-appimage/*.AppImage
                      latest.yml
                      latest-linux.yml
                      latest.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
