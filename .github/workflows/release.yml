name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm dist:linux
            - uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/*.AppImage
                      dist/*.deb
                      dist/*.rpm
                      dist/*.blockmap
                      dist/latest-linux.yml

    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm dist:win
            - uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/*.exe
                      dist/*.blockmap
                      dist/latest.yml
