name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run dist:linux
            - uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/*.AppImage
                      dist/*.deb
                      dist/*.rpm

    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run dist:win
            - uses: softprops/action-gh-release@v2
              with:
                  files: dist/**/*.exe
