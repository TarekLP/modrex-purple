name: Publish to WinGet

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Release tag to publish'
                required: true

jobs:
    publish:
        runs-on: windows-latest
        environment: release-delay
        steps:
            # komac creates the release branch at upstream's current head, and GitHub
            # reports that as a permissions error whenever the fork has not caught up.
            - name: Sync the winget-pkgs fork with upstream
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
              run: |
                  gh release download v2.16.0 --repo russellbanks/Komac --pattern komac-2.16.0-x86_64-pc-windows-msvc.exe --output komac.exe
                  ./komac.exe sync

            - uses: vedantmgoyal2009/winget-releaser@v2
              with:
                  identifier: Modrexio.Modrex
                  installers-regex: 'modrex_x86_64\.exe$'
                  # The action's own default covers the release event only, and its
                  # dispatch fallback resolves to the branch name rather than a tag.
                  release-tag: ${{ github.event.release.tag_name || inputs.tag_name }}
                  token: ${{ secrets.WINGET_TOKEN }}
                  # fork-user defaults to the repository owner, but the modrexio
                  # organization has no winget-pkgs fork. The fork lives on the
                  # maintainer account that WINGET_TOKEN belongs to, and komac
                  # fails to resolve the repository without this.
                  fork-user: ShulhaOleh
