name: CI

on:
    push:
        branches: [main]
        paths-ignore:
            - '**.md'
            - '.gitignore'
            - 'LICENSE'
    pull_request:
        branches: [main]
        paths-ignore:
            - '**.md'
            - '.gitignore'
            - 'LICENSE'

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
